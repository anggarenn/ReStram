[project]
name = "restram"
version = "2.9.2"
description = "ReStram Anime Streaming"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
